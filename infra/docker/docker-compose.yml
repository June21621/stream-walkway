version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: stream-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stream-network

  redis:
    image: redis:7-alpine
    container_name: stream-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stream-network

  # ================= apps =================
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: stream-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8080}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - stream-network

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: stream-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      writer:
        condition: service_started
      reader:
        condition: service_started
    networks:
      - stream-network

  youtube-service:
    build:
      context: ../../apps/youtube-service
      dockerfile: Dockerfile
    container_name: stream-youtube
    ports:
      - "${YOUTUBE_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - stream-network

  ml-service:
    build:
      context: ../../apps/ml-service
      dockerfile: Dockerfile
    container_name: stream-ml
    ports:
      - "${ML_PORT:-5001}:5000"
    environment:
      ENVIRONMENT: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - stream-network

  # ================= core services =================
  writer:
    build:
      context: ../../services/writer
      dockerfile: Dockerfile
    container_name: stream-writer
    ports:
      - "${WRITER_PORT:-8002}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stream-network

  reader:
    build:
      context: ../../services/reader
      dockerfile: Dockerfile
    container_name: stream-reader
    ports:
      - "${READER_PORT:-8001}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stream-network

volumes:
  postgres_data:
  redis_data:

networks:
  stream-network:
    driver: bridge
